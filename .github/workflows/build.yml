name: Build Unity WebGL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and Extract Project Outside Repo
        run: |
          cat project_chunk_* > /tmp/ExportedProject.zip
          mkdir -p /tmp/extracted_project
          unzip -q /tmp/ExportedProject.zip -d /tmp/extracted_project
          
          PROJECT_DIR=$(find /tmp/extracted_project -type f -name "ProjectVersion.txt" -exec dirname {} \; | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          git -C "$PROJECT_DIR" init
          git -C "$PROJECT_DIR" config user.name "builder"
          git -C "$PROJECT_DIR" config user.email "builder@ci.com"
          git -C "$PROJECT_DIR" add .
          git -C "$PROJECT_DIR" commit -m "Initialize dummy git repo"

      - name: Build WebGL Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: WebGL
          projectPath: ${{ env.PROJECT_DIR }}
          buildName: WebGLBuild
          allowDirtyBuild: true

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGLBuild
          path: build/WebGL
