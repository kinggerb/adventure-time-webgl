name: Build Unity WebGL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and Extract Project
        run: |
          cat project_chunk_* > ExportedProject.zip
          mkdir -p extracted_project
          unzip -q ExportedProject.zip -d extracted_project
          
          # Find where ProjectSettings actually lives
          PROJECT_DIR=$(find extracted_project -type f -name "ProjectVersion.txt" -exec dirname {} \; | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"

      - name: Build WebGL Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          projectPath: ${{ env.PROJECT_DIR }}
          buildName: WebGLBuild

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGLBuild
          path: build/WebGL
